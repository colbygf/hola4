      .tprt-testimonial-root {

      .tprt-testimonial-root {
        font-weight: 400;
        font-style:normal;

        text-transform: none;
        letter-spacing: normal;
        line-height: 1.15;

      flex-direction: column;
      border-right-width: 1px;
    }

    .tprt-testimonial-root .testimonial-thq-content-elm {
      gap: var(--dl-layout-space-threeunits);
      display: flex;
      align-items: flex-start;
      flex-direction: column;
    }

      object-fit: cover;
    }

    .tprt-testimonial-root .testimonial-text {

      font-size: 24px;
      line-height: 44px;

      gap: var(--dl-layout-space-unit);

    .tprt-testimonial-root .testimonial-thq-origin-elm {

    }

    .tprt-testimonial-root .testimonial-thq-divider-elm {
